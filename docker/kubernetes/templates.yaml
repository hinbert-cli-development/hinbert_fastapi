apiVersion: apps/v1
kind: Deployment
metadata:
  name: hinbert-fastapi
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app: hinbert-fastapi } }
  template:
    metadata: { labels: { app: hinbert-fastapi } }
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /docs, port: 8000 } }
---
apiVersion: v1
kind: Service
metadata: { name: hinbert-fastapi }
spec:
  selector: { app: hinbert-fastapi }
  ports: [{ port: {{ .Values.service.port }}, targetPort: 8000 }]