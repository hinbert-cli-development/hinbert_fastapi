apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hinbert-fastapi.fullname" . }}
data:
  ENVIRONMENT: {{ .Values.environment | quote }}
  APP_NAME: {{ .Values.appName | quote }}
  DATABASE_URL: {{ .Values.databaseUrl | quote }}
  REDIS_URL: {{ .Values.redisUrl | quote }}
  BACKEND_CORS_ORIGINS: {{ .Values.corsOrigins | quote }}
