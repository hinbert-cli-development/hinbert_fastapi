replicaCount: 2
environment: production
appName: Hinbert FastAPI
databaseUrl: postgresql+asyncpg://postgres:postgres@postgres:5432/app
redisUrl: redis://redis:6379/0
corsOrigins: '["https://example.com"]'
secretKey: replace-with-secret-manager-value
smtpPassword: ""
image:
  repository: hinbert-fastapi
  tag: latest
service:
  port: 8000
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 512Mi }
ingress:
  enabled: false
  className: nginx
  host: api.example.com