[build-system]
requires = ["setuptools>=60.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hinbert-fastapi"
version = "0.2.2"
description = "Professional FastAPI boilerplate with JWT auth, 2FA, PostgreSQL, Docker"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Hinbert Engineering" }]
license = { text = "MIT" }
classifiers = ["Development Status :: 3 - Alpha", "Framework :: FastAPI", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.12", "License :: OSI Approved :: MIT License"]
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "aiosqlite>=0.20,<1", "alembic>=1.13,<2", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "python-jose[cryptography]>=3.3,<4", "passlib[bcrypt]>=1.7,<2", "bcrypt>=4.0,<5", "pyotp>=2.9,<3", "slowapi>=0.1.9,<1", "loguru>=0.7,<1", "email-validator>=2.2,<3", "python-multipart>=0.0.9,<1", "redis>=5,<6", "aiosmtplib>=3,<4", "cryptography>=42,<46", "httpx>=0.27,<1"]

[project.urls]
Documentation = "https://github.com/hinbert/hinbert-fastapi#readme"
Repository = "https://github.com/hinbert/hinbert-fastapi"

[project.scripts]
hinbert = "hinbert_cli.main:cli"
hinbert-create-admin = "scripts.create_admin:main"
hinbert-seed = "scripts.seed_data:main"
hinbert-migrate = "scripts.run_migrations:main"

[tool.setuptools.packages.find]
include = ["hinbert_cli*", "app*", "scripts*"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 120
target-version = "py312"
lint.ignore = ["B008", "UP046"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]